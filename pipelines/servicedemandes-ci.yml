trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'

  projectPath: 'POCCDMicrosercices/Poc.DeliveryContinu.ServiceDemandes/Poc.DeliveryContinu.ServiceDemandes.csproj'
  testProjectPath: 'POCCDMicrosercices/Poc.DeliveryContinu.ServiceDemandes.Tests/Poc.DeliveryContinu.ServiceDemandes.Tests.csproj'

  acrName: 'acrpocunit01'
  imageRepository: 'servicedemandes'

steps:

# -------------------------------------------------------
# Checkout
# -------------------------------------------------------
- checkout: self
  clean: true

# -------------------------------------------------------
# Installer .NET 8
# -------------------------------------------------------
- task: UseDotNet@2
  displayName: "Installer .NET 8 SDK"
  inputs:
    packageType: sdk
    version: '8.x'

# -------------------------------------------------------
# Restore ServiceDemandes
# -------------------------------------------------------
- task: DotNetCoreCLI@2
  displayName: "Restaurer ServiceDemandes"
  inputs:
    command: restore
    projects: '$(projectPath)'

# -------------------------------------------------------
# Restore Tests
# -------------------------------------------------------
- task: DotNetCoreCLI@2
  displayName: "Restaurer les tests ServiceDemandes"
  inputs:
    command: restore
    projects: '$(testProjectPath)'

# -------------------------------------------------------
# Build ServiceDemandes
# -------------------------------------------------------
- task: DotNetCoreCLI@2
  displayName: "Compiler ServiceDemandes"
  inputs:
    command: build
    projects: '$(projectPath)'
    arguments: '--configuration $(buildConfiguration) --no-restore'

# -------------------------------------------------------
# Build Tests
# -------------------------------------------------------
- task: DotNetCoreCLI@2
  displayName: "Compiler les tests ServiceDemandes"
  inputs:
    command: build
    projects: '$(testProjectPath)'
    arguments: '--configuration $(buildConfiguration) --no-restore'

# -------------------------------------------------------
# Tests unitaires
# -------------------------------------------------------
- task: DotNetCoreCLI@2
  displayName: "Exécuter les tests unitaires ServiceDemandes"
  inputs:
    command: test
    projects: '$(testProjectPath)'
    arguments: '--configuration $(buildConfiguration) --no-build'
    publishTestResults: true

# -------------------------------------------------------
# Build + push image dans ACR
# -------------------------------------------------------
- task: AzureCLI@2
  displayName: "Construire et publier l'image ServiceDemandes dans ACR"
  inputs:
    azureSubscription: 'sc-sub-dev-exp-01'
    scriptType: pscore
    scriptLocation: inlineScript
    inlineScript: |
      $ErrorActionPreference = "Stop"

      Write-Host "=========================================="
      Write-Host "Construction de l'image Docker"
      Write-Host "=========================================="
      Write-Host "Registry : $(acrName)"
      Write-Host "Repository : $(imageRepository)"
      Write-Host "Tag : $(Build.BuildId)"

      az acr build `
        --registry $(acrName) `
        --image "$(imageRepository):$(Build.BuildId)" `
        POCCDMicrosercices/Poc.DeliveryContinu.ServiceDemandes

      if ($LASTEXITCODE -ne 0) {
        Write-Error "La construction ou la publication de l'image ACR a échoué."
        exit 1
      }

      Write-Host "Image publiée avec succès dans ACR."

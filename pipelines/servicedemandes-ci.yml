trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: windows-latest

variables:
  buildConfiguration: Release

  projectPath: POCCDMicrosercices/Poc.DeliveryContinu.ServiceDemandes/Poc.DeliveryContinu.ServiceDemandes.csproj
  testProjectPath: POCCDMicrosercices/Poc.DeliveryContinu.ServiceDemandes.Tests/Poc.DeliveryContinu.ServiceDemandes.Tests.csproj

steps:

# -------------------------------------------------------
# Checkout
# -------------------------------------------------------
- checkout: self
  clean: true

# -------------------------------------------------------
# Installer le SDK .NET
# -------------------------------------------------------
- template: templates/dotnet/install-sdk.yml
  parameters:
    sdkVersion: 8.x

# -------------------------------------------------------
# Restore ServiceDemandes
# -------------------------------------------------------
- template: templates/dotnet/restore.yml
  parameters:
    projectPath: $(projectPath)

# -------------------------------------------------------
# Restore projet de tests
# -------------------------------------------------------
- template: templates/dotnet/restore.yml
  parameters:
    projectPath: $(testProjectPath)

# -------------------------------------------------------
# Build ServiceDemandes
# -------------------------------------------------------
- template: templates/dotnet/build.yml
  parameters:
    projectPath: $(projectPath)
    configuration: $(buildConfiguration)

# -------------------------------------------------------
# Build projet de tests
# -------------------------------------------------------
- template: templates/dotnet/build.yml
  parameters:
    projectPath: $(testProjectPath)
    configuration: $(buildConfiguration)

# -------------------------------------------------------

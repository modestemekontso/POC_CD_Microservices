trigger: none
pr: none
 
resources:
  pipelines:
    - pipeline: servicedemandesCI
      source: POC_CD_Microservice
      trigger: true
 
pool:
  vmImage: 'windows-latest'
 
variables:
  azureServiceConnection: 'sc-sub-dev-exp-01'
  resourceGroup: 'rg-expsubdev01-modestemekontso-exp-cc-01'
  aksClusterName: 'aks-poc-unit-01'
  namespace: 'poc-unit'
  acrLoginServer: 'acrpocunit01.azurecr.io'
  imageRepository: 'servicedemandes'
  deploymentName: 'servicedemandes'
  containerName: 'servicedemandes'
 
steps:
 
# -------------------------------------------------------
# Checkout
# -------------------------------------------------------
- checkout: self
  clean: true
 
# -------------------------------------------------------
# Afficher le tag provenant du CI
# -------------------------------------------------------
- task: PowerShell@2
  displayName: "Identifier l'image produite par le CI"
  inputs:
    targetType: inline
    script: |
      Write-Host "Pipeline CI : $(resources.pipeline.servicedemandesCI.pipelineName)"
      Write-Host "Run CI      : $(resources.pipeline.servicedemandesCI.runID)"
      Write-Host "Image       : $(acrLoginServer)/$(imageRepository):$(resources.pipeline.servicedemandesCI.runID)"
 
# -------------------------------------------------------
# Connexion AKS
# -------------------------------------------------------
- task: AzureCLI@2
  displayName: "Connexion au cluster AKS"
  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: pscore
    scriptLocation: inlineScript
    inlineScript: |
      az aks get-credentials `
        --resource-group $(resourceGroup) `
        --name $(aksClusterName) `
        --overwrite-existing
 
# -------------------------------------------------------
# Appliquer les manifests
# -------------------------------------------------------
- task: AzureCLI@2
  displayName: "Appliquer les manifests ServiceDemandes"
  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: pscore
    scriptLocation: inlineScript
    inlineScript: |
      kubectl apply `
        -f POCCDMicrosercices/Poc.DeliveryContinu.ServiceDemandes/k8s/servicedemandes-deployment.yaml
 
      kubectl apply `
        -f POCCDMicrosercices/Poc.DeliveryContinu.ServiceDemandes/k8s/servicedemandes-service.yaml
 
# -------------------------------------------------------
# Déployer exactement l'image du CI
# -------------------------------------------------------
- task: AzureCLI@2
  displayName: "Déployer l'image ServiceDemandes"
  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: pscore
    scriptLocation: inlineScript
    inlineScript: |
      $imageTag = "$(resources.pipeline.servicedemandesCI.runID)"
      $image = "$(acrLoginServer)/$(imageRepository):$imageTag"
 
      Write-Host "Déploiement de : $image"
 
      kubectl set image deployment/$(deploymentName) `
        $(containerName)=$image `
        -n $(namespace)
 
# -------------------------------------------------------
# Vérifier rollout
# -------------------------------------------------------
- task: AzureCLI@2
  displayName: "Valider le déploiement ServiceDemandes"
  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: pscore
    scriptLocation: inlineScript
    inlineScript: |
      kubectl rollout status deployment/$(deploymentName) `
        -n $(namespace) `
        --timeout=180s
 
      Write-Host "Image actuellement déployée :"
 
      kubectl get deployment $(deploymentName) `
        -n $(namespace) `
        -o jsonpath="{.spec.template.spec.containers[0].image}"
 
      Write-Host ""
 
      kubectl get pods `
        -n $(namespace) `
        -l app=servicedemandes
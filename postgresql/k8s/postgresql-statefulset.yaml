apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: postgresql
  namespace: poc-unit
  labels:
    app: postgresql
    tier: database

spec:
  serviceName: postgresql
  replicas: 1

  selector:
    matchLabels:
      app: postgresql

  template:
    metadata:
      labels:
        app: postgresql
        tier: database

    spec:
      containers:
        - name: postgresql
          image: acrpocunit01.azurecr.io/postgresql:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5432
              name: postgresql

          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: POSTGRES_PASSWORD

            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          volumeMounts:
            - name: postgresql-storage
              mountPath: /var/lib/postgresql/data

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"

  volumeClaimTemplates:
    - metadata:
        name: postgresql-storage
        labels:
          app: postgresql
          tier: database
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: default
        resources:
          requests:
            storage: 5Gi
